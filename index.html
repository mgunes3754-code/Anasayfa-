
<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0d">
<title>MG TAG | Çok Amaçlı Dijital Kimlik Sistemi</title>
<meta name="description" content="MG TAG NFC teknolojisiyle araç, evcil hayvan ve dijital kimlik bilgilerinizi tek dokunuşla erişilebilir hale getirir.">
<style>
:root{
  --gold:#ffbf16;
  --gold2:#ffdf76;
  --bg:#07090d;
  --muted:#a9aeb8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow-x:hidden;
}
body:before{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  background:radial-gradient(ellipse at 70% 15%,#5b3a071e,transparent 45%),radial-gradient(ellipse at 5% 60%,#d49a1010,transparent 40%);
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.shell{max-width:1440px;margin:auto;padding:0 5%}
.header{
  height:86px;
  position:sticky;
  top:0;
  z-index:50;
  background:#080a0ded;
  backdrop-filter:blur(20px);
  border-bottom:1px solid #b88a2838;
}
.nav{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}
.logo{
  display:flex;
  flex-direction:column;
  line-height:1;
  white-space:nowrap;
}
.logo b{
  font-size:30px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-2px;
}
.logo b span,.gradient{color:var(--gold)}
.logo small{
  font-size:9px;
  letter-spacing:1.5px;
  margin-top:5px;
  color:#e6e6e6;
}
.links{display:flex;align-items:center;gap:28px}
.links a{
  font-size:13px;
  font-weight:750;
  color:#ddd;
  transition:.25s;
}
.links a:hover,.links a.active{color:var(--gold)}
.actions{display:flex;gap:12px}
.btn{
  border-radius:999px;
  border:1px solid #bd8d27;
  padding:13px 22px;
  background:transparent;
  color:white;
  font-weight:800;
  transition:transform .25s,box-shadow .25s,background .25s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
}
.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 0 24px #ffbf1640;
}
.btn.gold{
  background:linear-gradient(135deg,#ffe065,#ffb900);
  color:#111;
  border:0;
  box-shadow:0 0 22px #ffbf1635;
}
.hamb{
  display:none;
  border:1px solid #b88a2855;
  color:var(--gold);
  background:transparent;
  padding:10px 13px;
  border-radius:10px;
  font-size:22px;
}
.hero{
  position:relative;
  min-height:610px;
  display:grid;
  grid-template-columns:43% 57%;
  align-items:center;
  overflow:hidden;
}
.hero:after{
  content:'';
  position:absolute;
  bottom:0;
  left:20%;
  width:70%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 25px 4px #ffae18aa;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:10px;
  border:1px solid #bd8d274d;
  border-radius:30px;
  padding:9px 14px;
  color:var(--gold2);
  font-size:12px;
  letter-spacing:2px;
  background:#ffb9000b;
}
.hero h1{
  font-size:clamp(68px,8vw,120px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:-7px;
  margin:16px 0 0;
  line-height:1;
  text-shadow:0 0 30px #fff2;
}
.hero h2{
  font-size:clamp(23px,2.6vw,37px);
  line-height:1.15;
  font-style:italic;
  margin:8px 0 22px;
}
.hero p{
  font-size:17px;
  line-height:1.65;
  color:#d3d5d8;
  max-width:480px;
  border-left:5px solid var(--gold);
  padding-left:18px;
}
.hero-ctas{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:30px;
}
.visual{position:relative;height:550px;perspective:900px}
.orb{
  position:absolute;
  width:410px;
  height:410px;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-40%);
  background:radial-gradient(circle,#ffc22425,transparent 65%);
  filter:blur(6px);
}
.ring{
  position:absolute;
  left:50%;
  top:71%;
  width:70%;
  height:115px;
  transform:translate(-50%,-50%) rotateX(66deg);
  border:3px solid #ffc329;
  border-radius:50%;
  box-shadow:0 0 18px #ffc329,0 0 55px #ffc32970,inset 0 0 30px #ffc329;
}
.ring.two{
  width:85%;
  height:160px;
  opacity:.4;
  animation:pulse 3s infinite alternate;
}
.nfc-card{
  position:absolute;
  left:50%;
  top:53%;
  width:315px;
  height:185px;
  transform:translate(-50%,-50%) rotate(-11deg) rotateY(-13deg);
  border-radius:23px;
  background:linear-gradient(145deg,#25272a,#050505 70%);
  border:2px solid #ffbf16;
  box-shadow:0 0 30px #ffbf16a0,12px 22px 35px #000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  animation:float 5s ease-in-out infinite;
}
.nfc-card strong{
  font-size:43px;
  font-weight:1000;
  font-style:italic;
}
.nfc-card strong span{color:var(--gold)}
.nfc-card em{
  font-style:normal;
  font-size:27px;
  letter-spacing:5px;
}
.solution-floats{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.float-tile{
  position:absolute;
  width:145px;
  min-height:130px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-align:center;
  background:linear-gradient(145deg,#242321dd,#090909e8);
  border:1px solid #e6a625;
  border-radius:18px;
  box-shadow:0 0 24px #e7a91b60;
  transform:rotate(7deg);
  animation:tile 5s ease-in-out infinite;
}
.float-tile i{font-style:normal;font-size:40px}
.float-tile b{font-size:14px}
.tile1{top:8%;left:5%;transform:rotate(-8deg)}
.tile2{top:0;left:38%;animation-delay:-1s}
.tile3{top:8%;right:0;transform:rotate(9deg);animation-delay:-2s}
.tile4{bottom:5%;right:0;animation-delay:-3s}
